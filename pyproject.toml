[project]
name = "icn"
version = "0.1.0"
description = "Fork of icn-tools with updated dependencies and package-i-fied metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas <1.5",
    "scikit-image",
    "scikit-learn",
    "statsmodels",
    "numpy <2.1",
    "six",
    "requests"
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["icn*"]
